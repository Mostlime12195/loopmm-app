name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run prepare-web
      - name: Build (arm64 + x64, ad-hoc signed)
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check signature
        run: codesign --verify --deep --strict --verbose=2 dist/mac-arm64/loopmm.app
      - name: Smoke test (packaged arm64 app, offline model, scripted chat with an image)
        run: |
          set -o pipefail
          LOOPMM_SMOKE="$PWD/smoke.json" dist/mac-arm64/loopmm.app/Contents/MacOS/loopmm 2>&1 | tail -40
          cat smoke.json
          python3 -c "import json,sys; r=json.load(open('smoke.json')); print(json.dumps(r, indent=1)); sys.exit(0 if r['ok'] else 1)"
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke.json
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "loopmm $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*-mac.zip --clobber

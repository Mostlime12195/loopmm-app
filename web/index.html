<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loopmm</title>
<meta name="description" content="Try loopmm, a small looped multimodal model, on your own computer.">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b>loopmm</b><span class="sub">looped multimodal · runs on your computer</span></div>
    <button id="newchat" class="btn wide">New chat</button>
    <label class="field">Model
      <select id="model"></select>
    </label>
    <label class="field" id="thinkfield">Thinking
      <select id="thinking"></select>
    </label>
    <label class="field">Loops <output id="loopsv">3</output>
      <input id="loops" type="range" min="1" max="8" step="1" value="3">
      <small>How many times the middle 12 layers run. Trained at 3.</small>
    </label>
    <label class="field">Temperature <output id="tempv">0.7</output>
      <input id="temp" type="range" min="0" max="1.5" step="0.05" value="0.7">
    </label>
    <label class="field">Top-p <output id="toppv">0.9</output>
      <input id="topp" type="range" min="0.1" max="1" step="0.05" value="0.9">
    </label>
    <label class="field">Repetition penalty <output id="repv">1.1</output>
      <input id="rep" type="range" min="1" max="1.5" step="0.05" value="1.1">
    </label>
    <label class="field" id="maxfield">Max new tokens <output id="maxv">512</output>
      <input id="max" type="range" min="32" max="2048" step="32" value="512">
    </label>
    <label class="field" id="lenfield" hidden>Suggestion length <output id="lenv">16</output>
      <input id="len" type="range" min="4" max="64" step="2" value="16">
      <small>Tokens of grey text after the end of your text.</small>
    </label>
    <label class="field">Image detail
      <select id="detail"><option value="64">Low (64 tokens)</option><option value="256">Medium (256)</option><option value="576" selected>High (576)</option></select>
      <small>More detail reads the image slower.</small>
    </label>
    <div id="about"></div>
  </aside>
  <main>
    <header><button id="menu" class="btn icon" aria-label="Settings">☰</button><span id="status">Loading…</span><div id="bar" hidden><div></div></div></header>
    <section id="canvas" hidden>
      <div id="cimgs"><label class="addimg" title="Add an image. It goes before the text.">＋ image<input id="cfile" type="file" accept="image/*" multiple hidden></label></div>
      <div class="paper">
        <div class="mirror" id="mirror" aria-hidden="true"></div>
        <textarea id="ed" spellcheck="false" placeholder="Start writing. The model suggests how it continues, in grey."></textarea>
      </div>
    </section>
    <div id="canvasbar" hidden>
      <span class="hint"><kbd>Tab</kbd> word <kbd>→</kbd> all <kbd>Esc</kbd> hide</span>
      <span class="touch"><button id="bWord" class="btn" disabled>+ word</button><button id="bAll" class="btn" disabled>+ all</button></span>
    </div>
    <div id="log"><div id="empty"></div></div>
    <form id="composer">
      <div id="attach"></div>
      <div class="row">
        <label class="btn icon" title="Add an image" aria-label="Add an image">＋<input id="file" type="file" accept="image/*" multiple hidden></label>
        <textarea id="input" rows="1" placeholder="Message loopmm" autocomplete="off"></textarea>
        <button id="send" class="btn primary" type="submit" disabled>Send</button>
      </div>
    </form>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
